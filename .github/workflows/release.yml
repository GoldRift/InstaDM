name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a signed dry run (MAJOR.MINOR.PATCH)"
        required: true
        type: string
      publish:
        description: "Create or update the GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_API: "37.0"
  BUILD_TOOLS: "36.0.0"
  NDK_VERSION: "30.0.16248370"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            version="${INPUT_VERSION}"
            tag="v${version}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH, got '$version'"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          {
            echo "version=$version"
            echo "version_code=$code"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.INSTADM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.INSTADM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSTADM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSTADM_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::missing required secret $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/instadm-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/instadm-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "INSTADM_KEYSTORE=$RUNNER_TEMP/instadm-release.jks"
            echo "INSTADM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "INSTADM_KEY_ALIAS=$KEY_ALIAS"
            echo "INSTADM_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache: true
          cache-dependency-path: go-core/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_HOME is not set"
            exit 1
          fi
          export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${sdk_root}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"
          test -x "${sdk_root}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install gomobile
        working-directory: go-core
        run: |
          go mod download
          xmobile="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${xmobile}"
          go install "golang.org/x/mobile/cmd/gobind@${xmobile}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Go checks
        working-directory: go-core
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Build release APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build-release.sh \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version }}"

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Verify APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          apksigner="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"
          zipalign="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign"
          aapt2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          count=0
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            apk="build/dist/instadm-${VERSION}-${abi}.apk"
            if [[ ! -f "$apk" ]]; then
              echo "::error::missing $apk"
              exit 1
            fi
            "$apksigner" verify --min-sdk-version 24 "$apk" >/dev/null
            "$zipalign" -c -P 16 -v 4 "$apk" >/dev/null
            "$aapt2" dump badging "$apk" | grep -q "versionCode='${VERSION_CODE}'"
            "$aapt2" dump badging "$apk" | grep -q "versionName='${VERSION}'"
            "$aapt2" dump badging "$apk" | grep -q "native-code: '${abi}'"
            count=$((count + 1))
          done
          test "$count" -eq 4
          (cd build/dist && sha256sum -c SHA256SUMS >/dev/null)

      - name: Upload dry-run artifacts
        if: github.ref_type != 'tag' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: instadm-${{ steps.version.outputs.version }}
          path: build/dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/dist/* --clobber
            exit 0
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] ||
             gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh release create "$TAG" build/dist/* \
              --title "InstaDM ${TAG}" \
              --generate-notes
          else
            gh release create "$TAG" build/dist/* \
              --title "InstaDM ${TAG}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
